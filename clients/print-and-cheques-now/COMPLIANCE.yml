# Required presence checks
required_presence:
  - rule: blog_cta_present
    severity: critical
    check: "Every blog post must end with a CTA directing the reader to chequesnow.ca or the phone number (1-866-760-2661). See contact-block.md for approved phrasing."
    source: "STYLE-SYSTEM §5.3"
  - rule: dual_spelling_present
    severity: critical
    check: "Both 'cheque' (Canadian spelling) and 'check' (American spelling) must appear naturally in every blog post or page of meaningful length. This is an intentional dual-spelling SEO strategy — not an error. See STYLE-SYSTEM §3.5."
    source: "STYLE-SYSTEM §3.5"
  - rule: volume_claim_qualifier
    severity: critical
    check: "Any percentage-volume claim (60%, 50%, 25%) must be preceded by 'up to.' Scan the entire piece for bare percentage claims and add the qualifier."
    source: "STYLE-SYSTEM §4.1"
  - rule: cpa_credential_accuracy
    severity: warning
    check: "When the CPA credential is cited, use the full form: 'CPA Self-Accredited Printer #1010.' The certifying body must be named 'Payments Canada' — never 'Canadian Payments Association.'"
    source: "STYLE-SYSTEM §4.2"
  - rule: software_list_accuracy
    severity: warning
    check: "Software compatibility claims must match the confirmed list: QuickBooks, Sage 50, Xero, Simply Accounting. Do not add software not on this list."
    source: "STYLE-SYSTEM §4.3"
  - rule: guarantee_names_capitalized
    severity: warning
    check: "'Bank Acceptance Guarantee' and 'Price Match Guarantee' must be capitalized as proper names throughout the piece."
    source: "STYLE-SYSTEM §3.1"
  - rule: serp_analysis_required
    severity: warning
    check: "SERP analysis must be run before writing. Do not simulate — must access live search results. Location: Canada."
    source: "STYLE-SYSTEM §7"
  - rule: no_banking_relationship_language
    severity: critical
    check: "Do not use 'our bank,' 'our banking partners,' or any phrase implying Print & Cheques Now owns or manages banking relationships. The company prints Payments Canada-compliant cheques — it is not a bank."
    source: "STYLE-SYSTEM §3.4"
