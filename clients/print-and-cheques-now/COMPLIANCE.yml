# Compliance config — Print & Cheques Now
#
# Fail-closed rule set for the compliance-gate agent.
# Derived from STYLE-SYSTEM.md §3 (anti-slop rules + avoidance list), §4 (technical accuracy), and §5 (blog rules).
# severity: critical halts the pipeline before /ship; warning is reported but does not halt.

client: print-and-cheques-now
schema_version: 1

# Volume claim guards (critical — false advertising exposure if tripped)
banned_terms:
  - term: "Canadian Payments Association"
    severity: critical
    reason: "Retired name. The certifying body is now 'Payments Canada' — use that name exclusively (STYLE-SYSTEM §4.2)."
  - term: "60% more"
    severity: critical
    reason: "Volume claim must use 'up to' qualifier: 'up to 60% more.' Never state as absolute (STYLE-SYSTEM §4.1)."
  - term: "50% more"
    severity: critical
    reason: "Volume claim must use 'up to' qualifier: 'up to 50% more.' Never state as absolute (STYLE-SYSTEM §4.1)."
  - term: "25% more"
    severity: critical
    reason: "Volume claim must use 'up to' qualifier: 'up to 25% more.' Never state as absolute (STYLE-SYSTEM §4.1)."
  - term: "100% acceptance"
    severity: critical
    reason: "Do not claim 100% bank acceptance. The Bank Acceptance Guarantee covers reprinting or refunding — not an absolute acceptance rate (STYLE-SYSTEM §4.6)."
  - term: "guaranteed acceptance"
    severity: critical
    reason: "Do not use 'guaranteed acceptance' as a standalone claim. Use 'Bank Acceptance Guarantee' (capitalized) with the correct description: accepted or reprinted/refunded (STYLE-SYSTEM §4.6)."
  - term: "our bank"
    severity: critical
    reason: "Implies Print & Cheques Now owns banking relationships. The company prints cheques — it does not hold banking relationships (STYLE-SYSTEM §3.4)."
  - term: "our banking"
    severity: critical
    reason: "Implies banking ownership. Reframe around Payments Canada compliance (STYLE-SYSTEM §3.4)."
  - term: "cheque check"
    severity: critical
    reason: "Do not combine the two spellings as a compound. Use them separately in different sentence contexts (STYLE-SYSTEM §3.5)."
  - term: "cheques/checks"
    severity: critical
    reason: "Do not use the two spellings as a parenthetical compound. Use them separately as natural alternate references (STYLE-SYSTEM §3.5)."
  - term: "cheques (checks)"
    severity: critical
    reason: "Parenthetical compound is banned. Use both spellings naturally across separate sentences (STYLE-SYSTEM §3.5)."

  # Software compatibility guards
  - term: "compatible with all accounting software"
    severity: critical
    reason: "Do not claim universal software compatibility. Only confirmed platforms are: QuickBooks, Sage 50, Xero, Simply Accounting (STYLE-SYSTEM §4.3)."
  - term: "works with any accounting"
    severity: critical
    reason: "Do not claim compatibility beyond the confirmed software list (STYLE-SYSTEM §4.3)."

  # Anti-slop — highest-risk banned words (full list in STYLE-SYSTEM §3.2)
  - term: "delve"
    severity: warning
    reason: "AI fingerprint word. Replace with: explore, examine, look at (STYLE-SYSTEM §3.2)."
  - term: "utilize"
    severity: warning
    reason: "Use 'use' (STYLE-SYSTEM §3.2)."
  - term: "leverage"
    severity: warning
    reason: "Use 'use' (STYLE-SYSTEM §3.2)."
  - term: "robust"
    severity: warning
    reason: "Use 'strong,' 'reliable,' 'solid' (STYLE-SYSTEM §3.2)."
  - term: "seamless"
    severity: warning
    reason: "Use 'smooth,' 'easy' (STYLE-SYSTEM §3.2)."
  - term: "comprehensive"
    severity: warning
    reason: "Use 'full,' 'complete,' 'thorough' (STYLE-SYSTEM §3.2)."
  - term: "cutting-edge"
    severity: warning
    reason: "Use 'modern,' 'new,' 'latest' (STYLE-SYSTEM §3.2)."
  - term: "holistic"
    severity: warning
    reason: "Use 'complete,' 'full,' 'whole' (STYLE-SYSTEM §3.2)."
  - term: "innovative"
    severity: warning
    reason: "Describe what is actually new instead (STYLE-SYSTEM §3.2)."
  - term: "transformative"
    severity: warning
    reason: "Describe the actual change instead (STYLE-SYSTEM §3.2)."
  - term: "synergy"
    severity: warning
    reason: "Delete and rewrite the sentence (STYLE-SYSTEM §3.2)."
  - term: "tapestry"
    severity: critical
    reason: "Delete entirely (STYLE-SYSTEM §3.2)."
  - term: "testament"
    severity: warning
    reason: "Use 'proof,' 'evidence,' 'sign' (STYLE-SYSTEM §3.2)."
  - term: "embark"
    severity: warning
    reason: "Use 'start,' 'begin' (STYLE-SYSTEM §3.2)."
  - term: "journey"
    severity: warning
    reason: "Use 'process,' 'experience,' 'path' (STYLE-SYSTEM §3.2)."
  - term: "streamline"
    severity: warning
    reason: "Use 'simplify,' 'speed up,' 'cut steps from' (STYLE-SYSTEM §3.2)."
  - term: "elevate"
    severity: warning
    reason: "Use 'improve,' 'raise,' 'strengthen' (STYLE-SYSTEM §3.2)."
  - term: "unlock"
    severity: warning
    reason: "Use 'enable,' 'open up,' 'create' (STYLE-SYSTEM §3.2)."
  - term: "empower"
    severity: warning
    reason: "Say what capability it gives instead (STYLE-SYSTEM §3.2)."
  - term: "ecosystem"
    severity: warning
