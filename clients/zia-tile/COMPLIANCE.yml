# Compliance config — Zia Tile
#
# Fail-closed rule set for the compliance-gate agent (and consulted by
# material-guard + terminology-lint). Derived from STYLE-SYSTEM.md §3.2
# (avoidance list), §4 (technical accuracy), and the business exclusions.
#
# This is the Zia instance of a per-client pattern. The same shape ports to
# the other LinkGraph clients (Loti Labs, The Nash, 5Gstore, etc.) — each gets
# its own clients/{slug}/COMPLIANCE.yml. severity: critical halts the pipeline
# before /ship; warning is reported but does not halt.

client: zia-tile
schema_version: 1

# Hard business exclusions — never appear in customer-facing copy (§3.2)
banned_terms:
  - term: "free shipping"
    severity: critical
    reason: "Business exclusion (§3.2). Pickup is free; shipping is not."
  - term: "discount"
    severity: critical
    reason: "Business exclusion — no cheap/affordable/discount framing (§3.2)."
  - term: "cheap"
    severity: critical
    reason: "Business exclusion (§3.2)."
  - term: "affordable"
    severity: critical
    reason: "Business exclusion (§3.2)."
  - term: "returns"
    severity: critical
    reason: "Business exclusion (§3.2)."
  - term: "peel-and-stick"
    severity: critical
    reason: "Not a Zia category (§3.2)."
  - term: "bestselling"
    severity: warning
    reason: "Jamie removed ranking language repeatedly (§3.2)."
  - term: "best seller"
    severity: warning
    reason: "Jamie removed ranking language repeatedly (§3.2)."
  # May 2026 review additions — Jamie corrections that recurred across the cycle
  - term: "sources"
    severity: critical
    reason: "Zia does not merely source — the relationship is a production partnership. Use 'produces' or 'makes in partnership with' (§3.2)."
    context: production_attribution
  - term: "products"
    severity: critical
    reason: "Use 'tiles' or 'collections' or 'materials' in customer-facing copy. Jamie flagged repeatedly (§3.2)."
  - term: "laid"
    severity: warning
    reason: "Correct installation verb is 'set' per Jamie (§3.2)."
  - term: "the correct choice"
    severity: warning
    reason: "Never frame Zia's tile as the only or 'correct' answer. Use 'a great choice' or omit (§3.2)."
  - term: "most often specified"
    severity: warning
    reason: "Jamie: 'we never allude to best-sellers' (§3.2)."
  - term: "most popular"
    severity: warning
    reason: "Jamie: 'we never allude to best-sellers' (§3.2)."
  - term: "most specified"
    severity: warning
    reason: "Jamie: 'we never allude to best-sellers' (§3.2)."
  - term: "The practical summary"
    severity: warning
    reason: "Report-style section label. Transition through content, not through labeling it (§3.2)."
  - term: "Practical summary:"
    severity: warning
    reason: "Same pattern as 'The practical summary' (§3.2)."
  - term: "Understanding the differences between"
    severity: warning
    reason: "Meta-setup opener. Lead with the first useful information (§3.2)."

# Technical-accuracy guards — factual errors that fail QA (§4)
technical_guards:
  - rule: cotto_no_pools
    severity: critical
    check: "Unglazed Cotto must not be presented as pool/spa suitable."
    source: "§4.2"
  - rule: cotto_allende_no_freeze_thaw
    severity: critical
    check: "Cotto Allende must not be presented as outdoor freeze/thaw suitable."
    source: "§4.1"
  - rule: zellige_no_freeze_thaw
    severity: critical
    check: "Glazed zellige must not be presented as outdoor freeze/thaw suitable."
    source: "§4.1"
  - rule: cement_non_freeze_thaw_only
    severity: critical
    check: "Cement tile is exterior-suitable in non-freeze/thaw climates only."
    source: "§11, §12"
  - rule: no_combined_cotto_sealing
    severity: critical
    check: "Cotto and Cotto Allende sealing instructions must not be combined."
    source: "§4.3"
  - rule: no_crazing_on_unglazed
    severity: critical
    check: "Do not apply chips/pits/crazing to unglazed materials (Cotto)."
    source: "§4.11"
  - rule: no_kiln_type
    severity: warning
    check: "Do not specify kiln type (wood/gas-fired) without written confirmation."
    source: "§4.10"
  - rule: no_light_exposure_patina
    severity: warning
    check: "Patina references use and time only, not light/UV exposure."
    source: "§4.10"
  - rule: no_unsold_products
    severity: critical
    check: "Do not reference products Zia does not sell (e.g., Saltillo) without strategic reason confirmed by Alex; never position them favorably over Cotto."
    source: "§5.5"
  - rule: overage_rate_correct
    severity: critical
    check: "Overage must be stated as '15-20%' standard plus '25%' for specialty/uniform. Never '10-15%' (factually wrong, appeared on every ceramic page in May review)."
    source: "§4.9 / §9"
    pattern_reject: ["10-15%", "10 to 15%", "10–15%"]
    pattern_require: ["15-20%", "25%"]
  - rule: prop65_link_required
    severity: critical
    check: "Where 'Prop 65' or 'Proposition 65' text appears, the link ziatile.com/proposition-65-warnings must be present as a hyperlink (text reference alone is incomplete)."
    source: "§4.5 / §4.8"
  - rule: phone_present_with_email
    severity: critical
    check: "Where info@ziatile.com appears in a closing or contact context, the phone 310-844-1170 must appear in the same block. Email present without phone was a recurring May 2026 miss."
    source: "§4.6"
  - rule: colorway_verified
    severity: critical
    check: "Any colorway name asserted in a draft must appear in materials/{material}.md allowed_colorways or in STYLE-SYSTEM.md tables. Aegean and Absinthe (zellige v2) are flagged invented examples."
    source: "§4.7"
  - rule: production_step_verified
    severity: critical
    check: "Production-narrative verbs must come from STYLE-SYSTEM §4.6 verified steps. Zellige does not include 'chiseled' or 'manual chiseling' — use 'hand-shaped'."
    source: "§4.6"

# Voice exclusions — banned even though not a legal/factual risk (§2.1, §3.2)
voice_bans:
  - term: "luxury"
    severity: warning
  - term: "sophisticated"
    severity: warning
  - term: "charming"
    severity: warning
  # June 2026 — Brittany review: Tier 1 cliché/exaggerative adjectives, hard-banned (§2.7)
  - term: "beautiful"
    severity: warning
    reason: "Tier 1 cliché adjective (§2.7). Show quality through specific detail."
  - term: "stunning"
    severity: warning
    reason: "Tier 1 cliché adjective (§2.7). Show quality through specific detail."
  - term: "gorgeous"
    severity: warning
    reason: "Tier 1 cliché adjective (§2.7). Show quality through specific detail."
  - term: "exquisite"
    severity: warning
    reason: "Tier 1 exaggerative adjective (§2.7). Show quality through specific detail."
  - term: "defects"
    severity: critical
    reason: "Reframe as chips/pits/crazing characteristics (zellige) — never 'defects'."
  # May 2026 — Jamie voice corrections (contextual; lint catches the literal but flags warning to allow legitimate uses)
  - term: "recessive"
    severity: warning
    reason: "Vague hedge that does not describe anything. Use the specific design behavior in the room (§3.2)."
  - term: "muted"
    severity: warning
    reason: "Stand-alone descriptor. Use the specific behavior — 'sits quieter,' 'recedes' (§3.2). Allowed when paired with a specific quality."
  - term: "normal"
    severity: warning
    reason: "When describing variation. Use 'inherent' or 'characteristic of' (§3.2). Allowed in non-variation contexts."
  - term: "built to"
    severity: warning
    reason: "Aging/performance framing. Use 'crafted' or 'develops' — 'built to age' is poor word choice (§3.2)."
  - term: "deepens with use"
    severity: warning
    reason: "Patina framing. Use 'deepens with wear' (§3.2)."

# Required-presence checks
required_presence:
  - rule: contact_block
    severity: critical
    check: "info@ziatile.com and 310-844-1170 must appear together in closing + relevant FAQ."
    source: "§4.6"
  - rule: person_consistency
    severity: critical
    check: "First or third person held throughout; no second person anywhere."
    source: "§2.1, §6.4"
