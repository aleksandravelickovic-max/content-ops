# Compliance config — US Storage Units
#
# Fail-closed rule set for the compliance-gate agent.
# Derived from STYLE-SYSTEM.md §3 (anti-slop rules + avoidance list) and §4 (accuracy standards).
# severity: critical halts the pipeline before /ship; warning is reported but does not halt.

client: us-storage-units
schema_version: 1

# Marketplace accuracy guards — critical
# USStorageUnits.com is a marketplace. It does not own or operate facilities.
banned_terms:
  - term: "our facilities"
    severity: critical
    reason: "Implies the platform owns or operates storage facilities. Use 'facilities in the network' or 'listed facilities' (STYLE-SYSTEM §4.1)."
  - term: "our storage units"
    severity: critical
    reason: "Implies platform ownership of units. Attribute to facilities, not the platform (STYLE-SYSTEM §4.1)."
  - term: "our storage locations"
    severity: critical
    reason: "Implies platform ownership of locations (STYLE-SYSTEM §4.1)."
  - term: "our climate-controlled"
    severity: critical
    reason: "Attributes facility features to the platform as owner. Use 'climate-controlled units at listed facilities' (STYLE-SYSTEM §4.1)."
  - term: "we offer storage units"
    severity: critical
    reason: "Platform does not offer units — it lists facilities that do (STYLE-SYSTEM §4.1)."
  - term: "we operate"
    severity: critical
    reason: "Platform does not operate facilities (STYLE-SYSTEM §4.1)."
  - term: "we own"
    severity: critical
    reason: "Platform does not own facilities (STYLE-SYSTEM §4.1)."
  - term: "20,000"
    severity: critical
    reason: "20,000+ facilities is the sister site (US Self Storage). This client's confirmed network size is 10,000+ (STYLE-SYSTEM §4.5)."
  - term: "guaranteed results"
    severity: critical
    reason: "Wrong type of guarantee. The platform's guarantee is about price, not results (STYLE-SYSTEM §4.2)."
  - term: "storage journey"
    severity: warning
    reason: "Banned lifestyle framing for this client (STYLE-SYSTEM §3.3)."

