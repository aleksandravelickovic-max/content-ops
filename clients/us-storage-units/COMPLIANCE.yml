# Structural and accuracy presence checks
required_presence:
  - rule: marketplace_framing
    severity: critical
    check: "No language that implies the platform owns or operates storage facilities. All facility features must be attributed to 'facilities in the network,' 'listed facilities,' or 'partner facilities' — not to USStorageUnits.com as owner."
    source: "STYLE-SYSTEM §4.1"
  - rule: correct_network_size
    severity: critical
    check: "Network size must be cited as 10,000+ facilities. Do not use 20,000+ (that is the sister site US Self Storage)."
    source: "STYLE-SYSTEM §4.5"
  - rule: reserve_cta_present
    severity: critical
    check: "Every page must include a reserve-focused CTA that references the free reservation flow. Must use confirmed claim language: 'free to reserve,' 'no credit card required,' or 'guaranteed lowest prices.'"
    source: "STYLE-SYSTEM §6"
  - rule: no_invented_pricing
    severity: critical
    check: "No specific pricing figures for any unit or facility unless sourced from raw/ or confirmed by the CSM. Do not assert 'units start at $X' without a confirmed source."
    source: "STYLE-SYSTEM §4.3"
  - rule: unit_sizes_accurate
    severity: warning
    check: "Unit sizes must match confirmed dimensions: 5x5, 5x10, 10x10, 10x15, 10x20, 10x30 (standard); 3x4 ft lockers. Ceiling heights: 8-9 ft standard, 3-4 ft lockers. Do not invent other sizes."
    source: "STYLE-SYSTEM §4.4"
  - rule: serp_analysis_required
    severity: warning
    check: "SERP analysis must be run before writing. Do not simulate — must access live search results."
    source: "STYLE-SYSTEM §7"
  - rule: no_blog_content
    severity: critical
    check: "USStorageUnits.com has no blog. Do not produce editorial-style articles, how-to guides, or resource center content for this client without CSM approval."
    source: "STYLE-SYSTEM §5"
  - rule: primary_keyword_first_sentence
    severity: warning
    check: "Primary keyword must appear in the first sentence of body content."
    source: "STYLE-SYSTEM §7"
