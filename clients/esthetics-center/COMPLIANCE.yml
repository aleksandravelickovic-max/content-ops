    reason: "Banned lazy closer — write the actual CTA (STYLE-SYSTEM §3.3)."
  - term: "Don't hesitate to"
    severity: warning
    reason: "Banned lazy closer (STYLE-SYSTEM §3.3)."
  - term: "Imagine a world"
    severity: warning
    reason: "Banned hook opener (STYLE-SYSTEM §3.3)."
  - term: "Picture this"
    severity: warning
    reason: "Banned hook opener (STYLE-SYSTEM §3.3)."
  - term: "Have you ever wondered"
    severity: warning
    reason: "Banned hook opener (STYLE-SYSTEM §3.3)."
