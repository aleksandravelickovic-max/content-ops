# E-E-A-T / Dr. Rice trust signal guard
required_presence:
  - rule: dr_rice_trust_signals_blog
    severity: critical
    check: "Blog posts must include Dr. Rice trust signals exactly 3 times: in the 2nd or 3rd H2 section, in the 5th or 6th H2 section, and in the closing CTA."
    source: "STYLE-SYSTEM §5.2"
  - rule: blog_cta_present
    severity: critical
    check: "Every blog post must end with a CTA that includes: free consultation offer, phone (916) 941-9400, and contact URL (estheticscenter.com/contact)."
    source: "STYLE-SYSTEM §5.4"
  - rule: no_competitor_claims
    severity: critical
    check: "Do not make comparative claims against named competitor practices."
    source: "STYLE-SYSTEM §4"
  - rule: serp_analysis_required
    severity: warning
    check: "SERP analysis must be run before writing. Do not simulate — must access live search results."
    source: "STYLE-SYSTEM §7"
