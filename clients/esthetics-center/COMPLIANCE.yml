# Compliance config — Esthetics Center
#
# Fail-closed rule set for the compliance-gate agent.
# Derived from STYLE-SYSTEM.md §3 (anti-slop rules + avoidance list) and §4 (technical accuracy).
# severity: critical halts the pipeline before /ship; warning is reported but does not halt.

client: esthetics-center
schema_version: 1

# Medical accuracy guards
banned_terms:
  - term: "guaranteed results"
    severity: critical
    reason: "Cannot guarantee cosmetic outcomes (STYLE-SYSTEM §4)."
  - term: "guarantee"
    severity: critical
    reason: "Any outcome guarantee is off-limits in medical aesthetics (STYLE-SYSTEM §4)."
  - term: "guaranteed"
    severity: critical
    reason: "Any outcome guarantee is off-limits (STYLE-SYSTEM §4)."
  - term: "dramatic transformation"
    severity: critical
    reason: "Exaggerated claim (STYLE-SYSTEM §4)."
  - term: "eliminate"
    severity: warning
    reason: "Treatments improve or reduce — not eliminate."
  - term: "cure"
    severity: critical
    reason: "Medical aesthetics does not cure conditions."

# Anti-slop — highest-risk banned words (full list in STYLE-SYSTEM §3.2)
  - term: "delve"
    severity: warning
    reason: "AI fingerprint word. Replace with: explore, examine, look at (STYLE-SYSTEM §3.2)."
  - term: "utilize"
    severity: warning
    reason: "Use 'use' (STYLE-SYSTEM §3.2)."
  - term: "leverage"
    severity: warning
    reason: "Use 'use' (STYLE-SYSTEM §3.2)."
  - term: "robust"
    severity: warning
    reason: "Use 'strong,' 'reliable,' 'solid' (STYLE-SYSTEM §3.2)."
  - term: "seamless"
    severity: warning
    reason: "Use 'smooth,' 'easy' (STYLE-SYSTEM §3.2)."
  - term: "comprehensive"
    severity: warning
    reason: "Use 'full,' 'complete,' 'thorough' (STYLE-SYSTEM §3.2)."
  - term: "cutting-edge"
    severity: warning
    reason: "Use 'modern,' 'new,' 'latest' (STYLE-SYSTEM §3.2)."
  - term: "holistic"
    severity: warning
    reason: "Use 'complete,' 'full,' 'whole' (STYLE-SYSTEM §3.2)."
  - term: "innovative"
    severity: warning
    reason: "Describe what's actually new (STYLE-SYSTEM §3.2)."
  - term: "transformative"
    severity: warning
    reason: "Describe the actual change (STYLE-SYSTEM §3.2)."
  - term: "synergy"
    severity: warning
    reason: "Delete and rewrite the sentence (STYLE-SYSTEM §3.2)."
  - term: "tapestry"
    severity: critical
    reason: "Delete entirely (STYLE-SYSTEM §3.2)."
  - term: "testament"
    severity: warning
    reason: "Use 'proof,' 'evidence,' 'sign' (STYLE-SYSTEM §3.2)."
  - term: "embark"
    severity: warning
    reason: "Use 'start,' 'begin' (STYLE-SYSTEM §3.2)."
  - term: "journey"
    severity: warning
    reason: "Use 'process,' 'experience,' 'path' (STYLE-SYSTEM §3.2)."
  - term: "streamline"
    severity: warning
    reason: "Use 'simplify,' 'speed up,' 'cut steps from' (STYLE-SYSTEM §3.2)."
  - term: "elevate"
    severity: warning
    reason: "Use 'improve,' 'raise,' 'strengthen' (STYLE-SYSTEM §3.2)."
  - term: "unlock"
    severity: warning
    reason: "Use 'enable,' 'open up,' 'create' (STYLE-SYSTEM §3.2)."
  - term: "It's important to note"
    severity: warning
    reason: "Throat-clearing. Delete and start with the point (STYLE-SYSTEM §3.3)."
  - term: "In today's"
    severity: warning
    reason: "Banned opening phrase (STYLE-SYSTEM §3.3)."
  - term: "Let's dive"
    severity: warning
    reason: "Banned throat-clearing phrase (STYLE-SYSTEM §3.3)."
  - term: "In this article"
    severity: warning
    reason: "Banned throat-clearing phrase (STYLE-SYSTEM §3.3)."
  - term: "At the end of the day"
    severity: warning
    reason: "Empty hedge — delete (STYLE-SYSTEM §3.3)."
  - term: "In conclusion"
    severity: warning
    reason: "Banned lazy closer (STYLE-SYSTEM §3.3)."
  - term: "To sum up"
    severity: warning
    reason: "Banned lazy closer (STYLE-SYSTEM §3.3)."
  - term: "Feel free to reach out"
