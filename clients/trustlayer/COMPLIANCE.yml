# Compliance config — TrustLayer
#
# Fail-closed rule set for the compliance-gate agent.
# Derived from STYLE-SYSTEM.md §3 (terminology + anti-slop), §4 (technical accuracy), and §5 (blog rules).
# severity: critical halts the pipeline before /ship; warning is reported but does not halt.

client: trustlayer
schema_version: 1

# Platform category guards (critical — misrepresents the product if tripped)
banned_terms:
  - term: "insurance software"
    severity: critical
    reason: "TrustLayer is a third-party risk management platform, not insurance software. This is a product category error (STYLE-SYSTEM §4.1)."
  - term: "issues insurance"
    severity: critical
    reason: "TrustLayer does not issue insurance. It collects and verifies compliance documents (STYLE-SYSTEM §4.1, §4.2)."
  - term: "underwrites"
    severity: critical
    reason: "TrustLayer does not underwrite coverage of any kind. Do not use this word in relation to TrustLayer (STYLE-SYSTEM §4.2)."
  - term: "guaranteed compliance"
    severity: critical
    reason: "TrustLayer verifies and monitors compliance — it does not guarantee it. Remove this phrase (STYLE-SYSTEM §4.1)."
  - term: "compliance guaranteed"
    severity: critical
    reason: "TrustLayer verifies and monitors compliance — it does not guarantee it. Remove this phrase (STYLE-SYSTEM §4.1)."
  - term: "ensures your vendors are compliant"
    severity: critical
    reason: "TrustLayer monitors and flags — it does not ensure or guarantee vendor compliance. Use: 'monitors vendor compliance' or 'flags non-compliant coverage' (STYLE-SYSTEM §4.1)."
  - term: "guarantees your vendors"
    severity: critical
    reason: "TrustLayer does not guarantee vendor compliance. Use 'monitors' or 'verifies' (STYLE-SYSTEM §4.1)."

