# Required presence checks
required_presence:
  - rule: blog_cta_present
    severity: critical
    check: "Every blog post must end with a CTA directing the reader to request a demo, schedule a meeting, or get their free TrustScore. See contact-block.md for approved phrasing."
    source: "STYLE-SYSTEM §5.3"
  - rule: coi_spelled_out_on_first_use
    severity: critical
    check: "Every piece must spell out 'certificate of insurance (COI)' on first use. Abbreviating as 'COI' from the start is a compliance error."
    source: "STYLE-SYSTEM §3.1, §4.4"
  - rule: platform_category_check
    severity: critical
    check: "TrustLayer must be described as a third-party risk management platform or compliance document management platform. Any sentence that describes it as 'insurance software' or implies it issues or underwrites coverage must be rewritten before the piece ships."
    source: "STYLE-SYSTEM §4.1"
  - rule: trustscore_capitalization
    severity: warning
    check: "TrustScore must be capitalized exactly as shown — capital T, capital S. Check every instance."
    source: "STYLE-SYSTEM §3.1"
  - rule: no_invented_clients
    severity: critical
    check: "Only reference named clients confirmed in STYLE-SYSTEM §8: EL Ad, Grenadier Homes, PayneWest Insurance. Do not add client names not in this list."
    source: "STYLE-SYSTEM §4.3, §8"
  - rule: no_invented_pricing_or_limits
    severity: critical
    check: "Do not state coverage limits, pricing tiers, or feature specifications not confirmed in raw/knowledge/. Flag gaps to the CSM."
    source: "STYLE-SYSTEM §4.3"
  - rule: serp_analysis_required
    severity: warning
    check: "SERP analysis must be run before writing. Do not simulate — must access live search results."
    source: "STYLE-SYSTEM §7"
