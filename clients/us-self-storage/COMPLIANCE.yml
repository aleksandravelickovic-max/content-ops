# Required presence checks
required_presence:
  - rule: consumer_blog_cta_present
    severity: critical
    check: "Every consumer blog post must end with a CTA directing the reader to search, compare, or reserve on USSelfStorage.com. The CTA must mention the free online reservation. See contact-block.md for approved phrasing."
    source: "STYLE-SYSTEM §5.3"
  - rule: b2b_blog_cta_correct
    severity: critical
    check: "Storage Promoter Blog posts must use a B2B CTA (directed at facility operators). They must NOT use a consumer CTA (directed at people searching for storage). Check audience alignment before shipping."
    source: "STYLE-SYSTEM §5.4"
  - rule: marketplace_framing_check
    severity: critical
    check: "The platform must be described as a marketplace or comparison platform. Any sentence implying USSelfStorage.com owns or operates storage facilities must be rewritten before the piece ships."
    source: "STYLE-SYSTEM §4.1"
  - rule: network_size_accuracy
    severity: warning
    check: "If network size figures are used, they must match confirmed values: 20,000+ facilities, 2,000,000+ storage units. Do not round up, substitute alternate figures, or imply a different scale."
    source: "STYLE-SYSTEM §4.5"
  - rule: unit_size_accuracy
    severity: warning
    check: "Unit sizes stated in content must match confirmed specs: 5x5, 5x10, 10x10, 10x15, 10x20, 10x30. Do not invent or modify sizes. Do not add sizes not on this list."
    source: "STYLE-SYSTEM §8"
  - rule: serp_analysis_required
    severity: warning
    check: "SERP analysis must be run before writing. Do not simulate — must access live search results."
    source: "STYLE-SYSTEM §7"
  - rule: no_invented_pricing_or_availability
    severity: critical
    check: "Do not state specific prices, price ranges, or specific unit availability. Pricing and availability belong to individual facilities and vary. Use approved framing: 'compare current pricing' or 'check real-time availability.'"
    source: "STYLE-SYSTEM §4.2 and §4.3"
  - rule: sister_site_not_referenced
    severity: critical
    check: "Do not reference, link to, or compare with USStorageUnits.com (the sister site). Keep the two platforms entirely separate in all content."
    source: "STYLE-SYSTEM §4.6"
