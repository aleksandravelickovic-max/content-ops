# Compliance config — US Self Storage
#
# Fail-closed rule set for the compliance-gate agent.
# Derived from STYLE-SYSTEM.md §3 (anti-slop rules + avoidance list), §4 (technical accuracy), and §5 (blog rules).
# severity: critical halts the pipeline before /ship; warning is reported but does not halt.

client: us-self-storage
schema_version: 1

# Marketplace ownership guards (critical — false advertising exposure if tripped)
banned_terms:
  - term: "our facilities"
    severity: critical
    reason: "USSelfStorage.com does not own or operate storage facilities. Use 'facilities in the network' or 'facilities available through USSelfStorage.com' (STYLE-SYSTEM §4.1)."
  - term: "our storage units"
    severity: critical
    reason: "USSelfStorage.com does not own storage units. Use 'storage units available in your area' or 'units at facilities in the network' (STYLE-SYSTEM §4.1)."
  - term: "our climate-controlled"
    severity: critical
    reason: "Implies platform ownership of facilities. Reframe as 'climate-controlled facilities in the network' (STYLE-SYSTEM §4.1)."
  - term: "our drive-up"
    severity: critical
    reason: "Implies platform ownership. Reframe as 'drive-up facilities' or 'facilities offering drive-up access' (STYLE-SYSTEM §4.1)."
  - term: "our storage options"
    severity: critical
    reason: "Ownership-implying construction. Use 'storage options available through the platform' (STYLE-SYSTEM §4.1)."
  - term: "USSelfStorage.com's facilities"
    severity: critical
    reason: "Implies ownership. Use 'facilities listed on USSelfStorage.com' (STYLE-SYSTEM §4.1)."

  # Pricing accuracy guards
  - term: "guaranteed lowest prices"
    severity: critical
    reason: "This is USStorageUnits.com's brand claim — the sister site. Do NOT use for US Self Storage (STYLE-SYSTEM §4.2 and §4.6)."
  - term: "lowest prices guaranteed"
    severity: critical
    reason: "Variant of the sister site's pricing claim. Not a USSelfStorage.com claim (STYLE-SYSTEM §4.2)."
  - term: "lowest price guarantee"
    severity: critical
    reason: "Variant of the sister site's pricing claim. Not a USSelfStorage.com claim (STYLE-SYSTEM §4.2)."
  - term: "price match"
    severity: critical
    reason: "USSelfStorage.com does not offer price matching. Do not invent this claim (STYLE-SYSTEM §4.2)."

  # Anti-slop — highest-risk banned words (full list in STYLE-SYSTEM §3.2)
  - term: "delve"
    severity: warning
    reason: "AI fingerprint word. Replace with: explore, examine, look at (STYLE-SYSTEM §3.2)."
  - term: "utilize"
    severity: warning
    reason: "Use 'use' (STYLE-SYSTEM §3.2)."
  - term: "leverage"
    severity: warning
    reason: "Use 'use' (STYLE-SYSTEM §3.2)."
  - term: "robust"
    severity: warning
    reason: "Use 'strong,' 'reliable,' 'solid' (STYLE-SYSTEM §3.2)."
  - term: "seamless"
    severity: warning
    reason: "Use 'smooth,' 'easy' (STYLE-SYSTEM §3.2)."
  - term: "comprehensive"
    severity: warning
    reason: "Use 'full,' 'complete,' 'thorough' (STYLE-SYSTEM §3.2)."
  - term: "cutting-edge"
    severity: warning
    reason: "Use 'modern,' 'new,' 'latest' (STYLE-SYSTEM §3.2)."
  - term: "holistic"
    severity: warning
    reason: "Use 'complete,' 'full,' 'whole' (STYLE-SYSTEM §3.2)."
  - term: "innovative"
    severity: warning
    reason: "Describe what is actually new instead (STYLE-SYSTEM §3.2)."
  - term: "transformative"
    severity: warning
    reason: "Describe the actual change instead (STYLE-SYSTEM §3.2)."
  - term: "synergy"
    severity: warning
    reason: "Delete and rewrite the sentence (STYLE-SYSTEM §3.2)."
  - term: "tapestry"
    severity: critical
    reason: "Delete entirely (STYLE-SYSTEM §3.2)."
