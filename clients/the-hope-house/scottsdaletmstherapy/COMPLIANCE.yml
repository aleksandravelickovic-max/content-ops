  - term: "utilize"
    severity: warning
    reason: "Anti-slop banned term. Use 'use'. (STYLE-SYSTEM §2.4)"
  - term: "leverage"
    severity: warning
    reason: "Anti-slop banned term. Be specific about the mechanism. (STYLE-SYSTEM §2.4)"
  - term: "robust"
    severity: warning
    reason: "Anti-slop banned term. Describe what is substantial about it. (STYLE-SYSTEM §2.4)"
  - term: "seamless"
    severity: warning
    reason: "Anti-slop banned term. (STYLE-SYSTEM §2.4)"
  - term: "cutting-edge"
    severity: warning
    reason: "Anti-slop banned term. Name the specific technology instead. (STYLE-SYSTEM §2.4)"
  - term: "holistic"
    severity: warning
    reason: "Anti-slop banned term when used as puff. Use 'integrated' or describe the specific elements. (STYLE-SYSTEM §2.4)"
  - term: "synergy"
    severity: warning
    reason: "Anti-slop banned term. (STYLE-SYSTEM §2.4)"
  - term: "transformative"
    severity: warning
    reason: "Anti-slop banned term. Describe the specific outcome instead. (STYLE-SYSTEM §2.4)"
  - term: "innovative"
    severity: warning
    reason: "Anti-slop banned term. (STYLE-SYSTEM §2.4)"
  - term: "game-changing"
    severity: warning
    reason: "Anti-slop banned term. (STYLE-SYSTEM §2.4)"
  - term: "revolutionary"
    severity: warning
    reason: "Anti-slop banned term. (STYLE-SYSTEM §2.4)"

required_presence:
  - rule: seizure_risk_in_educational_content
    severity: critical
    check: "Any content that lists TMS side effects must include seizure risk, noting it is rare and higher in patients with seizure or epilepsy history. Omitting seizure risk from a side effects list is a compliance failure."
    source: "STYLE-SYSTEM §3.10"
  - rule: rems_with_spravato
    severity: critical
    check: "Any content discussing Spravato must note REMS certification and that administration is in-clinic only under medical supervision."
    source: "STYLE-SYSTEM §3.5"
  - rule: cost_qualifier_on_price
    severity: critical
    check: "When referencing the $2,000–$12,000 cost range, always note 'per full course' and that insurance coverage varies."
    source: "STYLE-SYSTEM §3.11"
  - rule: crisis_line_in_closing
    severity: critical
    check: "Every blog post and mental health content piece must reference 988 (call or text) in or near the closing CTA."
    source: "STYLE-SYSTEM §3.7"
  - rule: no_invented_staff
    severity: critical
    check: "Only three staff members are confirmed: Dr. Michael Vines (MD), Alyssa Gentile (PMHNP-BC, MSN), Sarah Ann Nguyen (MS, LPC). Do not invent names, titles, or credentials for additional staff."
    source: "STYLE-SYSTEM §3.8"
  - rule: no_invented_success_metrics
    severity: critical
    check: "No specific remission rates or success percentages have been confirmed from the site. Do not state any. Use 'significantly reduces depressive symptoms in many patients' or equivalent qualified language."
    source: "STYLE-SYSTEM §3.3"
