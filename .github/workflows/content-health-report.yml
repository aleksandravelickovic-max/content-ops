name: Content Health Report

on:
  schedule:
    # Tuesdays 07:00 UTC — matches the retired cloud routine
    - cron: "0 7 * * 2"
  workflow_dispatch:   # Allow manual trigger from the GitHub UI

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Set up GSC credentials
        run: |
          mkdir -p ~/.gsc-mcp ~/.config/gsc
          echo '${{ secrets.GSC_TOKEN_JSON }}' > ~/.gsc-mcp/oauth-token.json
          echo '${{ secrets.GSC_CLIENT_SECRETS_JSON }}' > ~/.config/gsc/client_secrets.json

      - name: Generate and post report
        env:
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          GSC_PROPERTY: sc-domain:searchatlas.com
          CHANNEL_ID: "8chy2nm-1554391"
        run: python3 dashboard/content_health_report.py
