services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contentops
      POSTGRES_USER: contentops
      POSTGRES_PASSWORD: contentops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentops"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://contentops:contentops@db:5432/contentops
      CONTENT_ROOT: /content/clients
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-in-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
    volumes:
      - ../clients:/content/clients:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
